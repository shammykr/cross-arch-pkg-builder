[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cross-arch-pkg-builder"
version = "0.1.0"
description = "Cross-architecture Debian package builder using QEMU and chroot environments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shammy Kumar", email = "shammykumarsbu27@gmail.com" }]
keywords = ["debian", "dpkg", "qemu", "chroot", "cross-compile", "multi-arch", "embedded"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["click>=8.1"]

[project.urls]
Homepage = "https://github.com/shammykr/cross-arch-pkg-builder"

[project.scripts]
xarch-pkg = "xarch_pkg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xarch_pkg"]
